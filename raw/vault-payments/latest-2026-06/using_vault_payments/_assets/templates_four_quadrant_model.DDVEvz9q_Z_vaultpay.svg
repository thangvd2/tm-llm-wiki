<svg xmlns="http://www.w3.org/2000/svg" height="520" width="640" viewBox="40 30 640 520" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <!-- Quadrant fills -->
    <linearGradient id="hardcodedFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e8eef4"/>
      <stop offset="100%" stop-color="#dce4ec"/>
    </linearGradient>
    <linearGradient id="populatedFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e6f2e6"/>
      <stop offset="100%" stop-color="#d4e8d4"/>
    </linearGradient>
    <linearGradient id="emptyFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8e6"/>
      <stop offset="100%" stop-color="#f5ecd4"/>
    </linearGradient>
    <linearGradient id="omittedFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#e2e2e2"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="640" height="520" fill="#fafbfc"/>

  <!-- Axis labels -->
  <!-- Horizontal axis label (top) -->
  <text x="390" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3748">Input Defined?</text>
  <text x="245" y="86" text-anchor="middle" font-size="12" fill="#4a5568">No</text>
  <text x="535" y="86" text-anchor="middle" font-size="12" fill="#4a5568">Yes</text>

  <!-- Horizontal axis arrows -->
  <line x1="150" y1="72" x2="620" y2="72" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="620,72 612,68 612,76" fill="#94a3b8"/>

  <!-- Vertical axis label (left) -->
  <text x="70" y="280" text-anchor="middle" font-size="13" font-weight="600" fill="#2d3748" transform="rotate(-90, 70, 280)">Value in base_instruction?</text>
  <text x="124" y="195" text-anchor="middle" font-size="12" fill="#4a5568">Yes</text>
  <text x="124" y="390" text-anchor="middle" font-size="12" fill="#4a5568">No</text>

  <!-- Vertical axis arrows -->
  <line x1="100" y1="470" x2="100" y2="100" stroke="#94a3b8" stroke-width="1.5"/>
  <polygon points="100,100 96,108 104,108" fill="#94a3b8"/>

  <!-- Grid container -->
  <g transform="translate(150, 100)">
    <!-- Main border -->
    <rect x="0" y="0" width="460" height="370" fill="none" stroke="#64748b" stroke-width="2" rx="4"/>

    <!-- Dividing lines -->
    <line x1="230" y1="0" x2="230" y2="370" stroke="#64748b" stroke-width="1.5"/>
    <line x1="0" y1="185" x2="460" y2="185" stroke="#64748b" stroke-width="1.5"/>

    <!-- Quadrant 1: Top-Left (Hardcoded) -->
    <rect x="2" y="2" width="226" height="181" fill="url(#hardcodedFill)" rx="2"/>
    <g transform="translate(115, 50)">
      <!-- Lock icon -->
      <rect x="-12" y="-8" width="24" height="18" rx="3" fill="none" stroke="#475569" stroke-width="2"/>
      <path d="M-8,-8 L-8,-14 A8,8 0 0,1 8,-14 L8,-8" fill="none" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <circle cx="0" cy="2" r="2.5" fill="#475569"/>
    </g>
    <text x="115" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Hardcoded value</text>
    <text x="115" y="112" text-anchor="middle" font-size="11" fill="#64748b">Value cannot be changed</text>
    <text x="115" y="126" text-anchor="middle" font-size="11" fill="#64748b">by operator</text>

    <!-- Quadrant 2: Top-Right (Populated) -->
    <rect x="232" y="2" width="226" height="181" fill="url(#populatedFill)" rx="2"/>
    <g transform="translate(345, 50)">
      <!-- Form field with value icon -->
      <rect x="-30" y="-12" width="60" height="24" rx="3" fill="#fff" stroke="#22863a" stroke-width="1.5"/>
      <text x="0" y="4" text-anchor="middle" font-size="10" fill="#22863a" font-family="monospace">default</text>
    </g>
    <text x="345" y="90" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Populated field</text>
    <text x="345" y="112" text-anchor="middle" font-size="11" fill="#64748b">Field renders pre-filled</text>
    <text x="345" y="126" text-anchor="middle" font-size="11" fill="#64748b">with default value</text>

    <!-- Quadrant 3: Bottom-Right (Empty) -->
    <rect x="232" y="187" width="226" height="181" fill="url(#emptyFill)" rx="2"/>
    <g transform="translate(345, 240)">
      <!-- Empty form field icon -->
      <rect x="-30" y="-12" width="60" height="24" rx="3" fill="#fff" stroke="#b45309" stroke-width="1.5"/>
      <line x1="-24" y1="6" x2="-18" y2="6" stroke="#d97706" stroke-width="1.5" stroke-linecap="round">
        <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
      </line>
    </g>
    <text x="345" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Empty field</text>
    <text x="345" y="307" text-anchor="middle" font-size="11" fill="#64748b">Field renders empty</text>
    <text x="345" y="321" text-anchor="middle" font-size="11" fill="#64748b">for operator input</text>

    <!-- Quadrant 4: Bottom-Left (Omitted) -->
    <rect x="2" y="187" width="226" height="181" fill="url(#omittedFill)" rx="2"/>
    <g transform="translate(115, 240)">
      <!-- Crossed out / absent icon -->
      <rect x="-20" y="-10" width="40" height="20" rx="3" fill="#e5e7eb" stroke="#9ca3af" stroke-width="1.5" stroke-dasharray="4,2"/>
      <line x1="-24" y1="-14" x2="24" y2="14" stroke="#6b7280" stroke-width="2" stroke-linecap="round"/>
    </g>
    <text x="115" y="285" text-anchor="middle" font-size="14" font-weight="600" fill="#1e293b">Omitted field</text>
    <text x="115" y="307" text-anchor="middle" font-size="11" fill="#64748b">Field does not exist</text>
    <text x="115" y="321" text-anchor="middle" font-size="11" fill="#64748b">in workflow</text>
  </g>

  <!-- Legend showing the two factors -->
  <g transform="translate(150, 490)">
    <text x="0" y="0" font-size="10" fill="#64748b">
      <tspan font-weight="500">base_instruction</tspan>: predefined value in template<tspan dx="16">|</tspan><tspan dx="16" font-weight="500">input</tspan>: field exposed to operator
    </text>
  </g>
</svg>