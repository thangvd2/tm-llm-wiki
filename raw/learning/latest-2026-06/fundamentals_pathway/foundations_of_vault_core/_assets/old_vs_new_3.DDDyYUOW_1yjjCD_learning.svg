  <text class="st7" transform="translate(473.6 369.5)"><tspan x="0" y="0">Monolithic</tspan></text>
  <text class="st6" transform="translate(340.7 429.8)"><tspan x="0" y="0">Legacy systems are often </tspan><tspan x="4.6" y="50.4">monolithic, carrying out a </tspan><tspan x="8.8" y="100.8">broad range of functions </tspan><tspan x="17.9" y="151.2">rather than carrying out </tspan><tspan x="-27.2" y="201.6">specific ones in the best way </tspan><tspan x="154.4" y="252">possible.</tspan></text>
  <text class="st7" transform="translate(1115.6 373.2)"><tspan x="0" y="0">Microservice architecture</tspan></text>
  <text class="st6" transform="translate(1156.9 433.2)"><tspan x="0" y="0">In Vault Core, we use a </tspan><tspan x="-25.1" y="50.4">microservice architecture </tspan><tspan x="-40.4" y="100.8">and our design encourages </tspan><tspan x="-38.6" y="151.2">you to surround Vault Core </tspan><tspan x="-16" y="201.6">with applications built to </tspan><tspan x="-7.9" y="252">carry out specific tasks.</tspan></text>
